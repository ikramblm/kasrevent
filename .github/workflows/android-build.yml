name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages
        # GitHub's ubuntu-latest runners already ship with a pre-installed, pre-licensed
        # Android SDK (ANDROID_HOME is already set) — no third-party action needed. We only
        # need to make sure the specific platform/build-tools this project compiles against
        # are present. Versions must match compileSdkVersion/targetSdkVersion in
        # frontend/android/variables.gradle. ("tools" is an obsolete package removed from the
        # SDK repository — never add it to this list.)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # Set this repo's Settings → Secrets and variables → Actions → Variables →
        # VITE_API_BASE_URL to your deployed backend's public URL (e.g.
        # https://api.kasrevent.example.com/api) before the app can talk to a real server.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build --workspace frontend

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: List APK output (debug)
        run: find frontend/android/app/build/outputs -type f -name "*.apk" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasrevent-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          # Fail the step loudly if the APK isn't where we expect, instead of silently
          # succeeding with no artifact (actions/upload-artifact@v4 defaults to "warn").
          if-no-files-found: error

      # Optional: attach the APK to a GitHub Release when you push a tag like "v1.0.0".
      # Uncomment once you're ready to cut real releases.
      # - name: Create release with APK
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
