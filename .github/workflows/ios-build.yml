name: Build iOS app (simulator, unsigned)

# Apple requires a paid Apple Developer Program membership + signing certificates/provisioning
# profiles to produce an installable IPA (for a real device, TestFlight, or the App Store) —
# nothing free can substitute for that, and this workflow does not have your Apple credentials.
# What this DOES do: compile the iOS app end-to-end on every push, unsigned, for the
# Simulator, as a build-health check. See docs/MOBILE.md for the steps to add real signing
# once you have an Apple Developer account.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build --workspace frontend

      - name: Sync Capacitor iOS project
        working-directory: frontend
        run: npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        # This project uses Capacitor's Swift Package Manager integration (no CocoaPods /
        # .xcworkspace), so we build the .xcodeproj directly.
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
