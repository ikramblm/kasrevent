name: kasrevent_mobile
description: "KasrEvent — native Android/iOS app for event hall booking and management."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  # Proper Android adaptive icon: transparent-background foreground layer + solid
  # background color, so the OS can mask/animate it correctly on API 26+ instead of
  # just scaling the flat square image (which is what image_path alone produces).
  adaptive_icon_background: "#4A1259"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
